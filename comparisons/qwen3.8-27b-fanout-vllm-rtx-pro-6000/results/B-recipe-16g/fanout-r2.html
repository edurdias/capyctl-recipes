<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// ---- bucket #1 ----
// Bucket 1: Core scene, camera, renderer, fog, lights, controls, resize, animation loop.

// Renderer
renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Scene
scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
scene.fog = new THREE.FogExp2(0x0a0e1a, 0.0035);

// Camera
camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 40, 140);
camera.lookAt(0, 15, 0);

// Controls
controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 15, 0);
controls.minDistance = 20;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

// Clock
clock = new THREE.Clock();

// Lights
// Moonlight (cool, directional, casts shadows)
const moonLight = new THREE.DirectionalLight(0x8fa8ff, 1.4);
moonLight.position.set(-80, 120, -60);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 400;
moonLight.shadow.camera.left = -120;
moonLight.shadow.camera.right = 120;
moonLight.shadow.camera.top = 120;
moonLight.shadow.camera.bottom = -120;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);

// Ambient (faint cool fill)
const ambientLight = new THREE.AmbientLight(0x2a3550, 0.6);
scene.add(ambientLight);

// Warm castle glow (point light near the castle, simulating lit windows / hearth)
const castleGlow = new THREE.PointLight(0xffb347, 2.5, 120, 2);
castleGlow.position.set(0, 25, 0);
scene.add(castleGlow);

// A subtle hemisphere light to soften the night
const hemiLight = new THREE.HemisphereLight(0x1a2540, 0x0a0a12, 0.4);
scene.add(hemiLight);

// Updaters array
updaters = [];

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation loop
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  for (const fn of updaters) {
    fn(dt, t);
  }
  controls.update();
  renderer.render(scene, camera);
});

// Bucket 2: Hogwarts castle geometry
{
  const b2_castle = new THREE.Group();
  scene.add(b2_castle);

  // Materials
  const b2_stoneMat = new THREE.MeshStandardMaterial({ color: 0x8a8578, roughness: 0.9, metalness: 0.05 });
  const b2_stoneDarkMat = new THREE.MeshStandardMaterial({ color: 0x6b6659, roughness: 0.95, metalness: 0.05 });
  const b2_roofMat = new THREE.MeshStandardMaterial({ color: 0x3a2e24, roughness: 0.8, metalness: 0.1 });
  const b2_windowMat = new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xffaa33, emissiveIntensity: 1.5, roughness: 0.3 });
  const b2_windowMat2 = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffbb44, emissiveIntensity: 1.2, roughness: 0.3 });

  // Helper: create a tower with conical spire
  function b2_createTower(x, z, height, radius, spireHeight, roofColor) {
    const group = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(radius, radius * 1.1, height, 12);
    const body = new THREE.Mesh(bodyGeo, b2_stoneMat);
    body.position.y = height / 2;
    group.add(body);

    // Spire
    const spireGeo = new THREE.ConeGeometry(radius * 1.2, spireHeight, 8);
    const spire = new THREE.Mesh(spireGeo, roofColor || b2_roofMat);
    spire.position.y = height + spireHeight / 2;
    group.add(spire);

    // Windows on tower
    const winGeo = new THREE.BoxGeometry(radius * 0.3, radius * 0.5, radius * 0.1);
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      const win = new THREE.Mesh(winGeo, b2_windowMat);
      win.position.set(Math.cos(angle) * radius * 0.9, height * 0.5, Math.sin(angle) * radius * 0.9);
      win.lookAt(0, height * 0.5, 0);
      group.add(win);
    }

    group.position.set(x, 0, z);
    return group;
  }

  // Helper: create a rectangular building with battlements
  function b2_createBuilding(x, z, width, depth, height, roofHeight) {
    const group = new THREE.Group();

    // Main body
    const bodyGeo = new THREE.BoxGeometry(width, height, depth);
    const body = new THREE.Mesh(bodyGeo, b2_stoneMat);
    body.position.y = height / 2;
    group.add(body);

    // Roof
    if (roofHeight > 0) {
      const roofGeo = new THREE.ConeGeometry(Math.max(width, depth) * 0.7, roofHeight, 4);
      const roof = new THREE.Mesh(roofGeo, b2_roofMat);
      roof.position.y = height + roofHeight / 2;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);
    }

    // Battlements (crenellations) on top
    const battW = width * 0.15;
    const battH = height * 0.15;
    const battD = depth * 0.15;
    const numBatt = Math.floor(width / (battW * 2));
    for (let i = 0; i < numBatt; i++) {
      const battGeo = new THREE.BoxGeometry(battW, battH, battD);
      const batt = new THREE.Mesh(battGeo, b2_stoneDarkMat);
      batt.position.set(-width / 2 + battW + i * battW * 2, height + battH / 2, 0);
      group.add(batt);
    }

    // Windows
    const winGeo = new THREE.BoxGeometry(width * 0.08, height * 0.15, 0.1);
    const numWinX = Math.floor(width / (width * 0.15));
    const numWinY = Math.floor(height / (height * 0.25));
    for (let ix = 0; ix < numWinX; ix++) {
      for (let iy = 0; iy < numWinY; iy++) {
        const win = new THREE.Mesh(winGeo, b2_windowMat2);
        win.position.set(
          -width / 2 + width * 0.15 + ix * (width * 0.15),
          height * 0.2 + iy * (height * 0.25),
          depth / 2 + 0.05
        );
        group.add(win);
      }
    }

    group.position.set(x, 0, z);
    return group;
  }

  // Great Hall - central large building
  const b2_greatHall = b2_createBuilding(0, 0, 20, 12, 10, 6);
  b2_castle.add(b2_greatHall);

  // Great Hall roof - long pointed
  const b2_greatRoofGeo = new THREE.ConeGeometry(14, 8, 4);
  const b2_greatRoof = new THREE.Mesh(b2_greatRoofGeo, b2_roofMat);
  b2_greatRoof.position.set(0, 14, 0);
  b2_greatRoof.rotation.y = Math.PI / 4;
  b2_greatRoof.scale.set(1.5, 1, 0.8);

    [-20, 0, 22, 3.5, 14],
    [20, 0, 22, 3.5, 14],

  b2_wall2.position.set(0, 2, 12);
  b2_castle.add(b2_wall2);

  const b2_wallGeo3 = new THREE.BoxGeometry(1, 4, 24);
  const b2_wall3 = new THREE.Mesh(b2_wallGeo3, b2_wallMat);
  b2_wall3.position.set(-15, 2, 0

// ---------- Shared terrain helpers ----------
function b3_hillHeight(x, z) {
  // Gentle rolling hills, kept low near the castle (origin) and the lake.
  const d = Math.sqrt(x * x + z * z);
  const castleMask = THREE.MathUtils.smoothstep(d, 40, 90); // 0 near castle -> 1 far
  const lakeMask = THREE.MathUtils.smoothstep(z, 55, 95);   // 0 north of lake -> 1 in lake
  const base =
    Math.sin(x * 0.045) * Math.cos(z * 0.045) * 6 +
    Math.sin(x * 0.11 + 1.3) * Math.cos(z * 0.09 - 0.7) * 3 +
    Math.sin(x * 0.02 - z * 0.03) * 8;
  const h = base * castleMask;
  // Flatten where the lake sits so water reads cleanly.
  return h * (1 - lakeMask * 0.85);
}

function b3_mountainHeight(x, z) {
  // Distant jagged peaks, only meaningful far from the centre.
  const d = Math.sqrt(x * x + z * z);
  const far = THREE.MathUtils.smoothstep(d, 150, 260);
  const jag =
    Math.sin(x * 0.02 + z * 0.015) * 22 +
    Math.sin(x * 0.05 - z * 0.04) * 10 +
    Math.cos(x * 0.013 + z * 0.021) * 16;
  return Math.max(0, jag) * far;
}

// ---------- Terrain mesh (hills + mountains) ----------
{
  const b3_size = 520;
  const b3_seg = 140;
  const b3_geo = new THREE.PlaneGeometry(b3_size, b3_size, b3_seg, b3_seg);
  b3_geo.rotateX(-Math.PI / 2);
  const b3_pos = b3_geo.attributes.position;
  for (let i = 0; i < b3_pos.count; i++) {
    const x = b3_pos.getX(i);
    const z = b3_pos.getZ(i);
    b3_pos.setY(i, b3_hillHeight(x, z) + b3_mountainHeight(x, z));
  }
  b3_geo.computeVertexNormals();

  const b3_terrainMat = new THREE.MeshStandardMaterial({
    color: 0x2f4a2c,
    roughness: 1.0,
    metalness: 0.0,
    flatShading: false,
  });
  const b3_terrain = new THREE.Mesh(b3_geo, b3_terrainMat);
  b3_terrain.position.y = -0.5;
  b3_terrain.receiveShadow = true;
  scene.add(b3_terrain);
}

// ---------- Black Lake (animated water) ----------
{
  const b3_lakeGeo = new THREE.PlaneGeometry(150, 120, 90, 70);
  b3_lakeGeo.rotateX(-Math.PI / 2);
  const b3_lakeMat = new THREE.MeshStandardMaterial({
    color: 0x0a1a2e,
    roughness: 0.15,
    metalness: 0.6,
    transparent: true,
    opacity: 0.92,
    emissive: 0x0a1420,
    emissiveIntensity: 0.4,
  });
  const b3_lake = new THREE.Mesh(b3_lakeGeo, b3_lakeMat);
  b3_lake.position.set(0, 0.4, 110); // south of the castle
  b3_lake.receiveShadow = true;
  scene.add(b3_lake);

  // Store base positions for the wave animation.
  const b3_lakeBase = b3_lakeGeo.attributes.position.array.slice();

  updaters.push((dt, t) => {
    const p = b3_lakeGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = b3_lakeBase[i * 3];
      const z = b3_lakeBase[i * 3 + 2];
      const y =
        Math.sin(x * 0.12 + t * 1.1) * 0.35 +
        Math.cos(z * 0.16 + t * 0.9) * 0.3 +
        Math.sin((x + z) * 0.07 + t * 0.6) * 0.25;
      p.setY(i, y);
    }
    p.needsUpdate = true;
    b3_lakeGeo.computeVertexNormals();
  });
}

// ---------- Lake shore / bank ring ----------
{
  const b3_bankGeo = new THREE.RingGeometry(70, 95, 64);
  b3_bankGeo.rotateX(-Math.PI / 2);
  const b3_bankMat = new THREE.MeshStandardMaterial({
    color: 0x3a2f22,
    roughness: 1.0,
  });
  const b3_bank = new THREE.Mesh(b3_bankGeo, b3_bankMat);
  b3_bank.position.set(0, 0.2, 110);
  scene.add(b3_bank);
}

// ---------- Forbidden Forest (stylised trees, west / negative x) ----------
{
  const b3_treeMat = new THREE.MeshStandardMaterial({
    color: 0x14301a,
    roughness: 0.9,
    metalness: 0.0,
    flatShading: true,
  });
  const b3_trunkMat = new THREE.MeshStandardMaterial({
    color: 0x2a1c12,
    roughness: 1.0,
  });

  const b3_treeGroup = new THREE.Group();
  const b3_treeCount = 160;
  const b3_treeSeeds = [];

  for (let i = 0; i < b3_treeCount; i++) {
    // Scatter across the western region.
    const x = -180 + Math.random() * 150; // -180 .. -30
    const z = -120 + Math.random() * 240;  // -120 .. 120
    const groundY = b3_hillHeight(x, z);
    const scale = 0.7 + Math.random() * 1.4;

    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.6 * scale, 3 * scale, 6), b3_trunkMat);
    trunk.position.y = 1.5 * scale;
    tree.add(trunk);

    // Three stacked cones for a stylised pine.
    for (let c = 0; c < 3; c++) {
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry((3.2 - c * 0.7) * scale, 3.5 * scale, 7),
        b3_treeMat
      );
      cone.position.y = (3 + c * 2.2) * scale;
      tree.add(cone);
    }

    tree.position.set(x, groundY, z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    b3_treeGroup.add(tree);
    b3_treeSeeds.push({ tree, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.5 });
  }
  scene.add(b3_treeGroup);

  // Gentle sway of the forest.
  updaters.push((dt, t) => {
    for (const s of b3_treeSeeds) {
      s.tree.rotation.z = Math.sin(t * s.speed + s.phase) * 0.03;
      s.tree.rotation.x = Math.cos(t * s.speed * 0.8 + s.phase) * 0.02;
    }
  });
}

// Bucket 4: Night sky — starfield, a large moon, slowly drifting clouds.

// --- Starfield -------------------------------------------------------------
// A big sphere of points scattered on a shell far outside the scene.
const b4_starGeo = new THREE.BufferGeometry();
{
  const b4_starCount = 4000;
  const b4_starPos = new Float32Array(b4_starCount * 3);
  const b4_starCol = new Float32Array(b4_starCount * 3);
  const b4_starSize = new Float32Array(b4_starCount);
  const b4_starRadius = 900;
  for (let i = 0; i < b4_starCount; i++) {
    // Uniform direction on a sphere (slightly flattened so it reads as a sky dome).
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    let x = Math.sin(phi) * Math.cos(theta);
    let y = Math.cos(phi);
    let z = Math.sin(phi) * Math.sin(theta);
    // Keep stars mostly above the horizon.
    if (y < 0.02) y = 0.02 + Math.random() * 0.05;
    const r = b4_starRadius * (0.9 + Math.random() * 0.1);
    b4_starPos[i * 3 + 0] = x * r;
    b4_starPos[i * 3 + 1] = y * r;
    b4_starPos[i * 3 + 2] = z * r;

    // Subtle colour variation: white, warm, cool.
    const tint = Math.random();
    let cr = 1.0, cg = 1.0, cb = 1.0;
    if (tint < 0.15) { cr = 1.0; cg = 0.92; cb = 0.8; }      // warm
    else if (tint < 0.3) { cr = 0.85; cg = 0.92; cb = 1.0; }  // cool
    const bright = 0.55 + Math.random() * 0.45;
    b4_starCol[i * 3 + 0] = cr * bright;
    b4_starCol[i * 3 + 1] = cg * bright;
    b4_starCol[i * 3 + 2] = cb * bright;
    b4_starSize[i] = 0.6 + Math.random() * 2.2;
  }
  b4_starGeo.setAttribute('position', new THREE.BufferAttribute(b4_starPos, 3));
  b4_starGeo.setAttribute('color', new THREE.BufferAttribute(b4_starCol, 3));
  b4_starGeo.setAttribute('size', new THREE.BufferAttribute(b4_starSize, 1));
}

const b4_starMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
  },
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    uniform float uTime;
    uniform float uPixelRatio;
    varying vec3 vColor;
    varying float vTwinkle;
    void main() {
      vColor = color;
      // Per-star twinkle phase derived from position.
      float phase = dot(position, vec3(0.13, 0.29, 0.47));
      vTwinkle = 0.55 + 0.45 * sin(uTime * 1.5 + phase * 6.2831);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = size * uPixelRatio * (300.0 / -mv.z);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vTwinkle;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.0, d);
      a *= a;
      gl_FragColor = vec4(vColor * vTwinkle, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const b4_stars = new THREE.Points(b4_starGeo, b4_starMat);
b4_stars.frustumCulled = false;
scene.add(b4_stars);

const b4_moonGroup = new THREE.Group();
{

    uniforms: {
      uColor: { value: new THREE.Color(0xcfd8ff) }

    fragmentShader: `
      varying vec2 vUv;

        a = pow(a, 2.2);
        gl_FragColor = vec4(uColor, a * 0.35);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  const b4_halo = new THREE.Mesh(b4_haloGeo, b4_haloMat);
  b4_halo.position.z = -1;
  b4_moonGroup.add(b4_halo);
}

// ---- bucket #5 ----
// ===== Bucket 5: Quidditch Pitch =====

const b5_pitchZ = 0;
const b5_pitchLen = 70;
const b5_pitchWid = 40;

const b5_fieldGeo = new THREE.CircleGeometry(1, 64);

const b5_hoopMat = new THREE.MeshStandardMaterial({ color: 0xccccaa, metalness: 0.6, roughness: 0.3 });
const b5_hoopHeight = 14;
const b5_hoopRadius = 1.2;
const b5_hoopTube = 0.15;

function b5_makeHoop(x, z) {
  const group = new THREE.Group();
  // Two vertical posts
  const postGeo = new THREE.CylinderGeometry(b5_hoopTube, b5_hoopTube, b5_hoopHeight, 8);
  const postL = new THREE.Mesh(postGeo, b5_hoopMat);
  postL.position.set(-b5_hoopRadius, b5_hoopHeight / 2, 0);
  const postR = new THREE.Mesh(postGeo, b5_hoopMat);
  postR.position.set(b5_hoopRadius, b5_hoopHeight / 2, 0);
  group.add(postL, postR);
  // Top ring
  const ringGeo = new THREE.TorusGeometry(b5_hoopRadius, b5_hoopTube, 8, 16);
  const ring = new THREE.Mesh(ringGeo, b5_hoopMat);
  ring.position.y = b5_hoopHeight;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  group.position.set(x, 0, z);
  return group;
}

// West end hoops (x = pitchX - pitchLen/2)
const b5_westX = b5_pitchX - b5_pitchLen / 2;
const b5_eastX = b5_pitchX + b5_pitchLen / 2;
const b5_hoopSpacing = 5;
for (let i = -1; i <= 1; i++) {
  const zOff = i * b5_hoopSpacing;

const b5_standMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });

function b5_makeStand(x, z, rotY, colorIdx) {
  const group = new THREE.Group();
  const standW = 20;
  const standD = 6;
  const standH = 8;
  const rows = 4;
  const rowH = standH / rows;

  for (let r = 0; r < rows; r++) {
    const rowGeo = new THREE.BoxGeometry(standW, rowH, standD);
    const rowMat = new THREE.MeshStandardMaterial({
      color: b5_houseColors[colorIdx],
      roughness: 0.7,
      metalness: 0.1
    });
    const row = new THREE.Mesh(rowGeo, rowMat);
    row.position.y = r * rowH + rowH / 2;
    group.add(row);
  }

  // Roof
  const roofGeo = new THREE.BoxGeometry(standW + 2, 0.5, standD + 2);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = standH + 0.25;
  group.add(roof);

  group.position.set(x, 0, z);
  group.rotation.y = rotY;
  return group;
}

// Bucket 6: Magic particles — floating candles, sparkles, fireflies
{
  const b6_candleGroup = new THREE.Group();
  const b6_candleGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.1, 10);
  const b6_candleMat = new THREE.MeshStandardMaterial({ color: 0xf3e6c4, roughness: 0.7, metalness: 0.05 });
  const b6_flameGeo = new THREE.ConeGeometry(0.12, 0.4, 8);
  const b6_flameMat = new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.95 });
  const b6_candles = [];
  const b6_candleCount = 26;
  for (let i = 0; i < b6_candleCount; i++) {
    const c = new THREE.Mesh(b6_candleGeo, b6_candleMat);
    const f = new THREE.Mesh(b6_flameGeo, b6_flameMat);
    f.position.y = 0.75;
    c.add(f);
    // scatter around the castle, mostly above the great hall / courtyard
    const ang = Math.random() * Math.PI * 2;
    const rad = 8 + Math.random() * 22;
    c.position.set(Math.cos(ang) * rad, 14 + Math.random() * 14, Math.sin(ang) * rad * 0.7);
    c.userData = {
      baseY: c.position.y,
      phase: Math.random() * Math.PI * 2,
      bobAmp: 0.4 + Math.random() * 0.6,
      bobSpeed: 0.4 + Math.random() * 0.5,
      spin: (Math.random() - 0.5) * 0.4,
      flame: f
    };
    b6_candleGroup.add(c);
    b6_candles.push(c);
  }
  scene.add(b6_candleGroup);

  // Sparkles: a soft additive point cloud drifting near the castle
  const b6_sparkCount = 400;
  const b6_sparkPos = new Float32Array(b6_sparkCount * 3);
  const b6_sparkSeed = new Float32Array(b6_sparkCount);
  for (let i = 0; i < b6_sparkCount; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = 4 + Math.random() * 34;
    b6_sparkPos[i * 3] = Math.cos(ang) * rad;
    b6_sparkPos[i * 3 + 1] = 6 + Math.random() * 26;
    b6_sparkPos[i * 3 + 2] = Math.sin(ang) * rad * 0.7;
    b6_sparkSeed[i] = Math.random() * Math.PI * 2;
  }
  const b6_sparkGeo = new THREE.BufferGeometry();
  b6_sparkGeo.setAttribute('position', new THREE.BufferAttribute(b6_sparkPos, 3));
  const b6_sparkMat = new THREE.PointsMaterial({
    color: 0xfff2c2, size: 0.35, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  const b6_sparkles = new THREE.Points(b6_sparkGeo, b6_sparkMat);
  scene.add(b6_sparkles);

  // Fireflies over the Forbidden Forest (west, negative x)
  const b6_ffCount = 160;
  const b6_ffPos = new Float32Array(b6_ffCount * 3);
  const b6_ffSeed = new Float32Array(b6_ffCount * 2);
  for (let i = 0; i < b6_ffCount; i++) {
    b6_ffPos[i * 3] = -40 - Math.random() * 40;
    b6_ffPos[i * 3 + 1] = 2 + Math.random() * 8;
    b6_ffPos[i * 3 + 2] = -20 + Math.random() * 60;
    b6_ffSeed[i * 2] = Math.random() * Math.PI * 2;
    b6_ffSeed[i * 2 + 1] = 0.5 + Math.random() * 1.5;
  }
  const b6_ffGeo = new THREE.BufferGeometry();
  b6_ffGeo.setAttribute('position', new THREE.BufferAttribute(b6_ffPos, 3));
  const b6_ffMat = new THREE.PointsMaterial({
    color: 0xb6ff5e, size: 0.5, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  const b6_fireflies = new THREE.Points(b6_ffGeo, b6_ffMat);
  scene.add(b6_fireflies);

  updaters.push((dt, t) => {
    // Candles: gentle bob + slow spin + flicker
    for (const c of b6_candles) {
      const u = c.userData;
      c.position.y = u.baseY + Math.sin(t * u.bobSpeed + u.phase) * u.bobAmp;
      c.rotation.y += u.spin * dt;
      const flick = 0.7 + 0.3 * Math.sin(t * 12 + u.phase * 3);
      u.flame.scale.setScalar(0.8 + flick * 0.4);
      u.flame.material.opacity = 0.6 + flick * 0.35;
    }
    // Sparkles: twinkle + slow rise
    const sp = b6_sparkGeo.attributes.position.array;
    for (let i = 0; i < b6_sparkCount; i++) {
      sp[i * 3 + 1] += dt * 0.3;
      if (sp[i * 3 + 1] > 34) sp[i * 3 + 1] = 6;
      sp[i * 3] += Math.sin(t * 0.5 + b6_sparkSeed[i]) * dt * 0.2;
    }
    b6_sparkGeo.attributes.position.needsUpdate = true;
    b6_sparkMat.opacity = 0.5 + 0.4 * Math.sin(t * 2);

    // Fireflies: wander + pulse
    const fp = b6_ffGeo.attributes.position.array;
    for (let i = 0; i < b6_ffCount; i++) {
      const s = b6_ffSeed[i * 2], sp2 = b6_ffSeed[i * 2 + 1];
      fp[i * 3] += Math.sin(t * sp2 + s) * dt * 0.6;
      fp[i * 3 + 1] += Math.cos(t * sp2 * 0.8 + s) * dt * 0.4;
      fp[i * 3 + 2] += Math.sin(t * sp2 * 0.6 + s * 1.3) * dt * 0.6;
    }
    b6_ffGeo.attributes.position.needsUpdate = true;
    b6_ffMat.opacity = 0.5 + 0.45 * Math.sin(t * 3);
  });
}
