{
  "schema_version": 1,
  "kind": "deployment",
  "name": "gptoss-vl032-cutlass",
  "engine": "vl032",
  "model": {
    "hf": "openai/gpt-oss-20b@6cee5e81ee83917806bbde320786a8fb61efebee"
  },
  "residency": "restart_only",
  "lmcache": "off",
  "timeouts": {
    "initialize": "1800s"
  },
  "engine_config": {
    "context_length": 131072,
    "max_concurrent_requests": 16,
    "kv_cache_dtype": "fp8_e4m3",
    "accept_extra_args": true,
    "memory": {
      "kv_cache": "40GiB"
    },
    "vllm": {
      "reasoning_parser": "openai_gptoss",
      "tool_call_parser": "openai"
    },
    "extra_args": [
      "--max-cudagraph-capture-size",
      "16",
      "--no-enable-prefix-caching",
      "--moe-backend",
      "flashinfer_cutlass"
    ]
  }
}
