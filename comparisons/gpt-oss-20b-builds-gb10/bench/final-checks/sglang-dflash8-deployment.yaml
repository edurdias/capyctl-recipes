# OpenAI GPT-OSS-20B on SGLang 0.5.22 + DFlash8, one GB10.
# capyctl deploy model --file deployment.yaml
# Start standalone with a managed limit of 108GiB and free reserve of 10GiB
# to reproduce the measured comparison budget; 80GiB exceeds its default limit.
# DFlash helps at tested 1k-4k inputs; disable it for long-input decode.
# The measured crossover is between 4k and 8k, not an exact universal cutoff.
schema_version: 1
kind: deployment
name: gpt-oss-20b-capyctl-sglang
# Register SGLang 0.5.22 with --approve-option=--speculative-draft-model-path
# --approve-path /home/me/drafters.
engine: sglang
# Download only SGLang's files, not the unused original/ and metal/ copies.
# OpenAI pin: openai/gpt-oss-20b@6cee5e81ee83917806bbde320786a8fb61efebee.
model:
  source:
    type: huggingface
    repo: openai/gpt-oss-20b
    revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    files:
      - model-00000-of-00002.safetensors
      - model-00001-of-00002.safetensors
      - model-00002-of-00002.safetensors
      - model.safetensors.index.json
      - config.json
      - generation_config.json
      - tokenizer.json
      - tokenizer_config.json
      - special_tokens_map.json
      - chat_template.jinja
residency: restart_only
lmcache: "off"
timeouts: {initialize: 1800s}
engine_config:
  context_length: 131072
  max_concurrent_requests: 16
  kv_cache_dtype: fp8_e4m3
  memory: {request: 80GiB}
  sglang:
    reasoning_parser: gpt-oss
    tool_call_parser: gpt-oss
  # The drafter is z-lab/gpt-oss-20b-DFlash at
  # d53f6551543204c859e8bbaaddbd15d11b447af9,
  # downloaded by hand (CapyCTL does not download drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args:
    - --cuda-graph-max-bs-decode
    - "16"
    - --swa-full-tokens-ratio
    - "0.1"
    - --speculative-algorithm
    - DFLASH
    - --speculative-draft-model-path
    - /home/me/drafters/gpt-oss-20b-DFlash
    - --speculative-draft-model-quantization
    - unquant
    - --speculative-dflash-block-size
    - "8"
