# The catalog recipe (sglang/qwen3.8-27b-nvfp4-gb10) as this comparison runs it: unchanged but
# for the name and a 1800 s first-start bound. Short-prompt runs.
schema_version: 1
kind: deployment
name: qwen38-dflash2
# The profile `capyctl engine add <sglang venv>
# --approve-option=--speculative-draft-model-path --approve-path /home/me/drafters`
# registered.
engine: sglang
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: nvidia/Qwen3.8-27B-NVFP4@482ca0f3832238542f8f5295dde86b5f22711d80}
# A first start with empty kernel caches builds FlashInfer and SGLang kernels.
timeouts: {initialize: 1800s}
engine_config:
  quantization: modelopt
  kv_cache_dtype: fp8_e4m3
  context_length: 32768
  # Up to 8 requests decoded together.
  max_concurrent_requests: 8
  # A 16 GiB FP8 KV pool, plus SGLang's recurrent state for 8 requests of this
  # hybrid model beside the weights and the drafter: CapyCTL refuses a smaller
  # request and names the one it needs.
  memory: {request: 65GiB, kv_cache: 16GiB}
  # The drafter is z-lab/Qwen3.8-27B-DFlash2, downloaded by hand (CapyCTL does
  # not download drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args:
    - --speculative-algorithm
    - DFLASH
    - --speculative-draft-model-path
    - /home/me/drafters/Qwen3.8-27B-DFlash2
    - --speculative-num-draft-tokens
    - "8"
    - --speculative-draft-model-quantization
    - unquant
