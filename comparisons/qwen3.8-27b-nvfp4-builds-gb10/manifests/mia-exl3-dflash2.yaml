version: "exllamav3-mia-63b32f00"
args: [--model, "{model_dir}", --host, "{host}", --port, "{port}",
       --cache_size, "{context_length}", --grid_size, "40", --cache_quant, nvfp4, --draft_model, "/home/me/drafters/Mia-AiLab--Qwen3.8-27B-DFlash2-EXL3-5.0bpw@4f043626"]
health: /health
