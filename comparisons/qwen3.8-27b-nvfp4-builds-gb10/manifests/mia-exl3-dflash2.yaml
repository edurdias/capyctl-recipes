# MiaAI-Lab's exllamav3 server (kit 12421873, fork 63b32f00) as a CapyCTL custom engine:
#   capyctl engine add --custom ~/exllamav3-mia-venv/bin/mia-serve --name mia-exl3-dflash2 \
#     --manifest manifests/mia-exl3-dflash2.yaml --yes
# The kit's start.sh command for DRAFT=dflash2, CACHE_QUANT=nvfp4, on loopback. The server
# decodes one request at a time; the others wait in its queue.
kind: custom_engine
