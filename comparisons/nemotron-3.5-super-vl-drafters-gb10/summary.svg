<text x="65" y="468" font-size="19" class="muted" font-weight="normal">Median of three rounds after warmup · 512 output-token cap · default thinking</text>
<text x="65" y="525" font-size="24" class="" font-weight="bold">Full task gate: PASS for MTP versus the same checkpoint and engine without drafts</text>
