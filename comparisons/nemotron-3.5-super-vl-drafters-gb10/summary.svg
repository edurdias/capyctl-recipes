<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Nemotron 3.5 Super VL: native MTP, with a 64k retrieval limit</title>
<desc id="desc">SGLang native MTP is faster and passes the task gate. Both rows have a seeded retrieval miss. MTP 96k and 111k retrieval was not completed after a hard freeze; its cause is unconfirmed.</desc>
<rect width="1400" height="1000" fill="#fafaf9"/>
