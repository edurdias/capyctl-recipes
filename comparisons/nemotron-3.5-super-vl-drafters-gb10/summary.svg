<text x="65" y="827" font-size="19" class="muted" font-weight="normal">Two paired GSM8K losses, one HumanEval gain; shared helper-function failures retained.</text>
<text x="65" y="866" font-size="19" class="muted" font-weight="normal">Each row has one real seeded retrieval miss; the task gate does not erase it.</text>
