# Gemma 4 26B A4B CapyCTL NVFP4 r3 on SGLang 0.5.22, one GB10.
# capyctl deploy model --file deployment.yaml
# Start standalone with a managed limit of 100GiB and free reserve of 10GiB
# to reproduce the measured comparison budget; 80GiB exceeds its default limit.
schema_version: 1
kind: deployment
name: gemma4-26b-a4b-capyctl-nvfp4-sglang
# Register SGLang 0.5.22 with --approve-option=--speculative-draft-model-path
# --approve-path /home/me/drafters.
engine: sglang
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: capyctl/Gemma-4-26B-A4B-NVFP4@241dbe0757d0fca815530e9216de6affb43565ff}
residency: restart_only
lmcache: "off"
timeouts: {initialize: 1800s}
engine_config:
  context_length: 131072
  kv_cache_dtype: fp8_e4m3
  memory: {request: 80GiB}
  sglang:
    chunked_prefill_size: 4096
    tool_call_parser: gemma4
    reasoning_parser: gemma4
  # The drafter is z-lab/gemma-4-26B-A4B-it-DFlash at
  # 77d4202772dfe50b2396ec7bac9cfffc7b9e7057,
  # downloaded by hand (CapyCTL does not download drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args:
    - --moe-runner-backend
    - flashinfer_cutlass
    - --speculative-algorithm
    - DFLASH
    - --speculative-draft-model-path
    - /home/me/drafters/gemma-4-26B-A4B-it-DFlash
    - --speculative-draft-model-quantization
    - unquant
    - --speculative-num-draft-tokens
    - "8"
