# Qwen3.8-27B NVFP4 on SGLang 0.5.21, sized to fit 32 GiB once ready;
# validated on one GB10 machine with CapyCTL's default limits.
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: qwen38-27b-sglang
# The profile `capyctl engine add <sglang venv>
# --approve-option=--model-loader-extra-config` registered.
engine: sglang
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: nvidia/Qwen3.8-27B-NVFP4@482ca0f3832238542f8f5295dde86b5f22711d80}
# SGLang 0.5.21 cannot reload modelopt weights from disk, which a deep park's
# wake does, so the model restarts instead of parking.
residency: restart_only
engine_config:
  quantization: modelopt
  kv_cache_dtype: fp8_e4m3
  context_length: 32768
  # One request at a time, as the SGLang cookbook's 32 GB cell.
  max_concurrent_requests: 1
  # A 1 GiB FP8 KV pool for the one request.
  memory: {kv_cache: 1GiB}
  sglang: {chunked_prefill_size: 2048}
  accept_extra_args: true
  # One CUDA graph for the one request, and the weights loaded one file at a time.
  extra_args: [--cuda-graph-max-bs-decode, "1", --model-loader-extra-config, '{"enable_multithread_load": false}']
