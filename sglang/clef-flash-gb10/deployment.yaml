# Clef-Flash (BF16) on SGLang 0.5.22, one GB10 machine: a decision model (POST /v1/systemone).
# capyctl deploy model --file deployment.yaml
# Needs SGLang 0.5.22 (the first release that serves decision models) in a virtual
# environment, registered with: capyctl engine add <venv>
schema_version: 1
kind: deployment
name: clef-flash
engine: sglang
# The checkpoint, under the models directory:
#   hf download Cloudflare/clef-flash \
#     --revision 8b2e5fd17c09fd49bc2880b805d5323ec7ff4ff3 \
#     --local-dir ~/models/clef-flash
model: clef-flash
# Answers POST /v1/systemone; chat completions are refused with api_mismatch.
api: decisions
# Decision models start and stop; they do not park.
residency: restart_only
devices: [{id: gpu0}]
# Stated memory; CapyCTL measured a 51.8 GiB peak (startup.measured).
resources: {gpu: 48GiB, ram: 4GiB}
engine_config:
  context_length: 16384
