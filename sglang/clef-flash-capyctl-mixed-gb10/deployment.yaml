# Clef-Flash CapyCTL mixed r1; SGLang 0.5.22 decisions API.
# Replace 1e72872e4c70b563038336637391e05704f2ccb4 with the uploaded commit before provisioning.
# Resource values are requests, not measured runtime residency.
schema_version: 1
kind: deployment
name: clef-flash-capyctl-mixed
engine: sglang
model:
  source:
    type: huggingface
    repo: capyctl/clef-flash-NVFP4-FP8
    revision: 1e72872e4c70b563038336637391e05704f2ccb4
    # Exact staged package names; publisher Python and non-runtime metadata omitted.
    files:
      - LICENSE
      - chat_template.jinja
      - config.json
      - generation_config.json
      - joint_head.safetensors
      - joint_head_config.json
      - model-00001.safetensors
      - model-00002.safetensors
      - model-00003.safetensors
      - model-00004.safetensors
      - model.safetensors.index.json
      - processor_config.json
      - tokenizer.json
      - tokenizer_config.json
api: decisions
residency: restart_only
devices: [{id: gpu0}]
resources: {gpu: 48GiB, ram: 4GiB}
timeouts: {initialize: 1800s}
engine_config:
  context_length: 16384
  max_concurrent_requests: 1
  kv_cache_dtype: fp8_e4m3
  accept_extra_args: true
  extra_args:
    - --mamba-ssm-dtype
    - bfloat16
