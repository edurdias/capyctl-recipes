# Qwen3.8-27B with every large Linear in NVFP4 (capyctl/Qwen3.8-27B-NVFP4) on SGLang 0.5.22
# with the DFlash2 drafter, one GB10 machine.
# capyctl deploy model --file deployment.yaml
# The 65 GiB request is above the standalone's default managed limit (50 %, 60.8 GiB on a
# GB10): start CapyCTL with
# `capyctl start standalone --set host.resource_policy.memory.system.managed_limit=80%`.
schema_version: 1
kind: deployment
name: qwen38-27b-capyctl-nvfp4-sglang
# The profile `capyctl engine add <sglang 0.5.22 venv>
# --approve-option=--speculative-draft-model-path --approve-path /home/me/drafters`
# registered.
engine: sglang
# Downloaded into <models>/sources on first deploy, pinned to this commit. It is converted
# from Qwen/Qwen3.8-27B by ../../vllm/qwen3.8-27b-capyctl-nvfp4-gb10/convert/.
model: {hf: capyctl/Qwen3.8-27B-NVFP4@4a47ea5eaf0bbc80ede6b392aa94e0dcc1980ab6}
# This SGLang 0.5.22 environment has no memory saver, so the deployment restarts instead of
# parking; with torch-memory-saver installed, drop this line for CapyCTL's default.
residency: restart_only
# A first start with empty kernel caches builds FlashInfer and SGLang kernels.
timeouts: {initialize: 1800s}
engine_config:
  quantization: modelopt
  kv_cache_dtype: fp8_e4m3
  context_length: 32768
  # Up to 8 requests decoded together.
  max_concurrent_requests: 8
  # A 16 GiB FP8 KV pool, plus SGLang's recurrent state for 8 requests of this hybrid model
  # beside the weights and the drafter.
  memory: {request: 65GiB, kv_cache: 16GiB}
  # The drafter is z-lab/Qwen3.8-27B-DFlash2, downloaded by hand (CapyCTL does not download
  # drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args:
    - --speculative-algorithm
    - DFLASH
    - --speculative-draft-model-path
    - /home/me/drafters/Qwen3.8-27B-DFlash2
    - --speculative-num-draft-tokens
    - "8"
    - --speculative-draft-model-quantization
    - unquant
    # MiaAI-Lab's GB10 flags (github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark): the Gated
    # DeltaNet state in bf16, and two decode steps per scheduler round.
    - --mamba-ssm-dtype
    - bfloat16
    - --num-continuous-decode-steps
    - "2"
