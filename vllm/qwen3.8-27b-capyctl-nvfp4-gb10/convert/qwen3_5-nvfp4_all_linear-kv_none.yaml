# NVFP4 (W4A4, group 16) on every large Linear of the language model: MLP, lm_head,
# self-attention q/k/v/o and the Gated DeltaNet in_proj_qkv / in_proj_z / out_proj.
# KV cache unquantized.
#
# The same layout as nvidia/Qwen3.8-27B-NVFP4 except that the 208 projections that
# checkpoint keeps in FP8 (48 x 3 DeltaNet, 16 x 4 attention, 7.2 GB) are NVFP4 here.
# Decode reads every weight once a token, so this takes the bytes read a token from
# 17.6 GB to about 14.5 GB.
#
# Based on ../../../comparisons/frognano-4b-nvfp4-three-engines-gb10/convert/
# qwen3_5-nvfp4_mlp-fp8_attn-kv_none.yaml (ModelOpt 0.47.0 modelopt_recipes/huggingface/
# qwen3_5/ptq/w4a16_nvfp4-fp8_attn-kv_fp8_cast with NVFP4 input quantizers on the MLP and
# lm_head and the KV-cache cast removed), with the FP8 entries replaced by NVFP4.
# Stays BF16: embed_tokens, linear_attn.in_proj_a / in_proj_b, conv1d, A_log, dt_bias, all
# norms, the vision tower (model.visual.*) and the MTP head (mtp.*), which the MTP/EAGLE
# recipes draft with.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    NVFP4 W4A4 on the MLP, lm_head, self-attention and linear-attention qkv/z/out projections,
    BF16 everything else, no KV-cache quantization, max calibration.
quantize:
  algorithm:
    method: max
    layerwise:
      enable: false
  quant_cfg:
    - $import: base_disable_all

    - quantizer_name: '*mlp*gate_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*gate_proj*input_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*up_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*up_proj*input_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*down_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*down_proj*input_quantizer*'
      cfg: {$import: nvfp4}

    - quantizer_name: '*self_attn*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*self_attn*input_quantizer'
      cfg: {$import: nvfp4}

    - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.out_proj*input_quantizer'
      cfg: {$import: nvfp4}

    - $import: default_disabled_quantizers

    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false

    # default_disabled_quantizers disables *lm_head*; re-enable NVFP4 W4A4 on it.
    - quantizer_name: '*lm_head*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*lm_head*input_quantizer'
      cfg: {$import: nvfp4}
