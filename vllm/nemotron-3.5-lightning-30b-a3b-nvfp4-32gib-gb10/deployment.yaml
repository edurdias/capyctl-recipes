# Nemotron 3.5 Lightning 30B-A3B NVFP4 on vLLM 0.30.0, sized to fit 32 GiB
# once ready; validated on one GB10 machine with CapyCTL's default limits.
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: nemotron35-30b-vllm
# The profile `capyctl engine add <vllm venv>` registered.
engine: vllm
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4@bee7596271d1495f6992ae224aefde4410e816b8}
# CapyCTL's default residency: the model parks deep (vLLM sleeps and
# reloads its weights from disk on wake).
engine_config:
  kv_cache_dtype: fp8
  context_length: 32768
  max_concurrent_requests: 4
  # A 2 GiB FP8 KV cache: 342,016 tokens beside the Mamba state.
  memory: {kv_cache: 2GiB}
  vllm: {tool_call_parser: qwen3_coder, reasoning_parser: nemotron_v3}
