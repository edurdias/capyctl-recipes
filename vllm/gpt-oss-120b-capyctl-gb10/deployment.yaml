# GPT-OSS-120B CapyCTL MXFP4 experts + FP8 attention on vLLM 0.32.0, one GB10.
# Register vLLM with --approve-env PYTORCH_CUDA_ALLOC_CONF and the verified tokenizer vocabulary.
