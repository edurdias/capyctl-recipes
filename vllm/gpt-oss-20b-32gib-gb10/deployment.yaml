# gpt-oss-20b on vLLM 0.30.0, sized to fit 32 GiB once ready; validated on
# one GB10 machine with CapyCTL's default limits.
# Register vLLM with the tokenizer vocabulary first (README):
#   capyctl engine add ~/vllm-0.30.0-venv --env TIKTOKEN_ENCODINGS_BASE=$HOME/tiktoken-encodings
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: gpt-oss-20b-vllm
# The profile `capyctl engine add <vllm venv>` registered.
engine: vllm
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: openai/gpt-oss-20b@6cee5e81ee83917806bbde320786a8fb61efebee}
# vLLM 0.30.0 does not restore gpt-oss after a deep park (its attention
# weights fail to reload), so the model restarts instead of parking (README).
residency: restart_only
engine_config:
  context_length: 32768
  max_concurrent_requests: 8
  # A 4 GiB KV cache for up to 8 requests.
  memory: {kv_cache: 4GiB}
  vllm: {tool_call_parser: openai, reasoning_parser: openai_gptoss}
