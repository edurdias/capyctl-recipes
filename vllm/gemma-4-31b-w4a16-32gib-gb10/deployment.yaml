# Gemma 4 31B (Google's QAT INT4 W4A16 checkpoint) on vLLM 0.30.0, sized to
# fit 32 GiB once ready; validated on one GB10 machine with CapyCTL's default
# limits.
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: gemma4-31b-vllm
# The profile `capyctl engine add <vllm venv>` registered.
engine: vllm
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: google/gemma-4-31B-it-qat-w4a16-ct@52f3f65bc7a02d555763bc923bd1d9094898219d}
# Deep parking needs vLLM's sleep mode, which holds 33 GiB once ready and
# peaks at 69 GiB while loading (README), so the model restarts instead.
residency: restart_only
engine_config:
  kv_cache_dtype: fp8
  # Text only: the vision tower is not loaded.
  language_model_only: true
  context_length: 32768
  max_concurrent_requests: 2
  # A 4 GiB FP8 KV cache: 40,832 tokens. vLLM needs 3.21 GiB for one
  # request of 32,768 tokens and refused to start with 2 GiB.
  memory: {kv_cache: 4GiB}
  vllm: {tool_call_parser: gemma4, reasoning_parser: gemma4}
