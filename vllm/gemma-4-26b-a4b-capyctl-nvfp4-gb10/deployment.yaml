# Gemma 4 26B A4B CapyCTL NVFP4 r3 on vLLM 0.32.0, one GB10.
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: gemma4-26b-a4b-capyctl-nvfp4-vllm
# Register vLLM 0.32.0 with --approve-option=--speculative-config
# --approve-path /home/me/drafters.
engine: vllm
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: capyctl/Gemma-4-26B-A4B-NVFP4@241dbe0757d0fca815530e9216de6affb43565ff}
residency: restart_only
lmcache: "off"
timeouts: {initialize: 1800s}
engine_config:
  context_length: 131072
  kv_cache_dtype: fp8_e4m3
  memory: {kv_cache: 40GiB}
  vllm:
    max_num_batched_tokens: 4096
    tool_call_parser: gemma4
    reasoning_parser: gemma4
  # The drafter is google/gemma-4-26B-A4B-it-assistant at
  # 6e5aaaf4c42b98394530b8fda2e95cadd65c151c,
  # downloaded by hand (CapyCTL does not download drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args:
    - --speculative-config
    - '{"method":"mtp","model":"/home/me/drafters/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":3}'
