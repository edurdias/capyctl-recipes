name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest CapyCTL release
        run: |
          curl -fsSL https://edurdias.github.io/capyctl/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate every deployment.yaml
        run: |
          capyctl --version
          shopt -s globstar nullglob
          files=(**/deployment.yaml)
          status=0
          for f in "${files[@]}"; do
            capyctl validate config --file "$f" || status=1
          done
          echo "checked ${#files[@]} file(s)"
          exit "$status"
