# Qwen3.8-27B NVFP4 on TensorFold 0.6.5 with the DFlash2 drafter, sized to fit
# 32 GiB once ready; validated on one GB10 machine with CapyCTL's default limits.
# capyctl deploy model --file deployment.yaml
schema_version: 1
kind: deployment
name: qwen38-27b-tf
# The profile `capyctl engine add <tensorfold venv> --approve-option=--drafter
# --approve-path /home/me/drafters` registered.
engine: tensorfold
# Downloaded into <models>/sources on first deploy, pinned to this commit.
model: {hf: nvidia/Qwen3.8-27B-NVFP4@482ca0f3832238542f8f5295dde86b5f22711d80}
devices: [{id: gpu0}]
# TensorFold cannot free its memory while it runs, so the model never parks.
residency: restart_only
# 32 GiB in every phase but `parked`. CapyCTL caps TensorFold at the `ready`
# bytes (TENSORFOLD_CUDA_MEMORY_LIMIT_GB). With CapyCTL newer than 0.1.2 the
# same is `resources: {gpu: 30GiB, ram: 2GiB}`, the form the benchmark ran with.
resources:
  cold:
    allocations: [{domain: unified, bytes: 32GiB, host_kv_bytes: 0B}]
    devices: [{id: gpu0}]
  ready:
    allocations: [{domain: unified, bytes: 32GiB, host_kv_bytes: 0B}]
    devices: [{id: gpu0}]
  parking:
    allocations: [{domain: unified, bytes: 32GiB, host_kv_bytes: 0B}]
    devices: [{id: gpu0}]
  parked:
    allocations: [{domain: unified, bytes: 0B, host_kv_bytes: 0B}]
    devices: []
  wake:
    allocations: [{domain: unified, bytes: 32GiB, host_kv_bytes: 0B}]
    devices: [{id: gpu0}]
engine_config:
  context_length: 32768
  # Two requests decoded together.
  max_concurrent_requests: 2
  # The drafter is z-lab/Qwen3.8-27B-DFlash2, downloaded by hand (CapyCTL does
  # not download drafters). Change the path to where yours is.
  accept_extra_args: true
  extra_args: [--drafter, /home/me/drafters/Qwen3.8-27B-DFlash2]
